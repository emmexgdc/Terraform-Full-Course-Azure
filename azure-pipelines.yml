# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
 branches:
   include:
     - main
     - features/*
 paths:
   include:
     - lessons/day26/*
     - azure-pipelines.yml

stages:
- stage: validate
  jobs:
  - job: tf_validate
    pool:
      name: 'azureagent'
    steps: 

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          sudo apt-get update
          sudo apt-get install -y unzip
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/lessons/day26/dev'
        backendAzureRmUseEntraIdForAuthentication: false
        backendServiceArm: 'Azure subscription 1(3a54638a-f7b3-4cd1-af13-7707b69b9ebe)'
        backendAzureRmResourceGroupName: 'terraform-tfstate-rg'
        backendAzureRmStorageAccountName: 'tfdevbackend2025gdc'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/lessons/day26/dev'

- stage: Dev_deploy
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs: 
  - job: terraform_apply_dev
    pool:
      name: 'azureagent'
    steps: 
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/lessons/day26/dev'
        backendAzureRmUseEntraIdForAuthentication: false
        backendServiceArm: 'Azure subscription 1(3a54638a-f7b3-4cd1-af13-7707b69b9ebe)'
        backendAzureRmResourceGroupName: 'terraform-tfstate-rg'
        backendAzureRmStorageAccountName: 'tfdevbackend2025gdc'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/lessons/day26/dev'
        commandOptions: '--auto-approve'
        environmentServiceNameAzureRM: 'Azure subscription 1(3a54638a-f7b3-4cd1-af13-7707b69b9ebe)'

- stage: stage_deploy
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - job: terraform_apply_stage
      pool:
        name: 'azureagent'
      steps:
        - task: TerraformInstaller@1
          displayName: Install Terraform
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/lessons/day26/staging'
            backendAzureRmUseEntraIdForAuthentication: false
            backendServiceArm: 'Azure subscription 1(3a54638a-f7b3-4cd1-af13-7707b69b9ebe)'
            backendAzureRmResourceGroupName: 'terraform-tfstate-rg'
            backendAzureRmStorageAccountName: 'tfstagebackend2025gdc'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'stage.terraform.tfstate'
        - task: TerraformTask@5
          displayName: Terraform Validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/lessons/day26/staging'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/lessons/day26/staging'
            commandOptions: '--auto-approve'
            environmentServiceNameAzureRM: 'Azure subscription 1(3a54638a-f7b3-4cd1-af13-7707b69b9ebe)'

        - task: AzureCLI@2
          displayName: create pr from features to main
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
          inputs:
            azureSubscription: 'Azure subscription 1(3a54638a-f7b3-4cd1-af13-7707b69b9ebe)'
            scriptType: 'batch'
            scriptLocation: 'inlineScript'
            inlineScript: |
              az repos pr create \
                          --repository $(Build.Repository.Name) \
                          --source-branch dev \
                          --target-branch main \
                          --title "Auto PR: dev → main" \
                          --description "CI pipeline opened this PR"
          


 